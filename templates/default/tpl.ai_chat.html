<div class="ai-chat-container"
     id="{CONTAINER_ID}"
     role="region"
     aria-label="{CHAT_ARIA_LABEL}"
     data-chat-id="{CHAT_ID}"
     data-api-url="{API_URL}"
     data-system-prompt="{SYSTEM_PROMPT}"
     data-max-memory="{MAX_MEMORY}"
     data-char-limit="{CHAR_LIMIT}"
     data-persistent="{PERSISTENT}"
     data-ai-service="{AI_SERVICE}"
     data-page-id="{PAGE_ID}"
     data-parent-id="{PARENT_ID}"
     data-parent-type="{PARENT_TYPE}"
     data-include-page-context="{INCLUDE_PAGE_CONTEXT}"
     data-background-files="{BACKGROUND_FILES}"
     data-enable-chat-uploads="{ENABLE_CHAT_UPLOADS}"
     data-enable-streaming="{ENABLE_STREAMING}"
     data-is-anonymous="{IS_ANONYMOUS}"
     data-service-unavailable="{SERVICE_UNAVAILABLE}"
     data-no-service-available="{NO_SERVICE_AVAILABLE}"
     data-clear-chat-confirm="{CLEAR_CHAT_CONFIRM}"
     data-copy-message-title="{COPY_MESSAGE_TITLE}"
     data-regenerate-response-title="{REGENERATE_RESPONSE_TITLE}"
     data-message-copied="{MESSAGE_COPIED}"
     data-message-copy-failed="{MESSAGE_COPY_FAILED}"
     data-thinking-header="{THINKING_HEADER}"
     data-generation-stopped="{GENERATION_STOPPED}"
     data-regenerate-failed="{REGENERATE_FAILED}"
     data-welcome-message="{WELCOME_MESSAGE}"
     data-stop-generation="{STOP_GENERATION}"
     data-remove-attachment="{REMOVE_ATTACHMENT}"
     data-send-aria-label="{SEND_ARIA_LABEL}"
     data-loading-text="{LOADING_TEXT}"
     data-max-file-size-mb="{MAX_FILE_SIZE_MB}"
     data-max-attachments-per-message="{MAX_ATTACHMENTS_PER_MESSAGE}"
     data-error-max-attachments="{ERROR_MAX_ATTACHMENTS}"
     data-error-file-too-large="{ERROR_FILE_TOO_LARGE}"
     data-max-total-upload-size-mb="{MAX_TOTAL_UPLOAD_SIZE_MB}"
     data-error-total-upload-too-large="{ERROR_TOTAL_UPLOAD_TOO_LARGE}"
     data-error-file-type-not-allowed="{ERROR_FILE_TYPE_NOT_ALLOWED}"
     data-error-file-upload-failed="{ERROR_FILE_UPLOAD_FAILED}"
     data-loading-text="{LOADING_TEXT}"
     data-new-message-aria="{NEW_MESSAGE_ARIA}"
     data-sources-label="{SOURCES_LABEL}"
     data-rag-incomplete-notice="{RAG_INCOMPLETE_NOTICE}"
     data-rag-upload-processing="{RAG_UPLOAD_PROCESSING}"
     data-rag-upload-completed="{RAG_UPLOAD_COMPLETED}"
     data-rag-upload-failed="{RAG_UPLOAD_FAILED}"
     data-rag-upload-empty="{RAG_UPLOAD_EMPTY}"
     data-page-label="{PAGE_LABEL}"
     data-pages-label="{PAGES_LABEL}"
     data-table-copy="{TABLE_COPY}"
     data-table-export-csv="{TABLE_EXPORT_CSV}"
     data-code-copy="{CODE_COPY}"
     data-citation-more-source="{CITATION_MORE_SOURCE}"
     data-citation-more-sources="{CITATION_MORE_SOURCES}"
     data-source-previous="{SOURCE_PREVIOUS}"
     data-source-next="{SOURCE_NEXT}"
     data-alert-note="{ALERT_NOTE}"
     data-alert-tip="{ALERT_TIP}"
     data-alert-important="{ALERT_IMPORTANT}"
     data-alert-warning="{ALERT_WARNING}"
     data-alert-caution="{ALERT_CAUTION}"
     data-is-admin="{IS_ADMIN}">

    <!-- Chat Header -->
    <div class="ai-chat-header">
        <h3 id="{CONTAINER_ID}-title">{CHAT_TITLE}</h3>
        <div class="ai-chat-header-actions">
            <button class="ai-chat-theme-toggle"
                    type="button"
                    title="{THEME_TOGGLE_TITLE}"
                    aria-label="{THEME_TOGGLE_LABEL}">
            </button>
            <!-- BEGIN chat_offline_badge -->
            <div class="ai-chat-offline-badge">
                <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                </svg>
                <span>{OFFLINE_BADGE_TEXT}</span>
            </div>
            <!-- END chat_offline_badge -->
            <button class="ai-chat-clear-btn"
                    type="button"
                    title="{CLEAR_CHAT_TITLE}"
                    aria-label="{CLEAR_CHAT_LABEL}">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false">
                    <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
                    <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Chat Messages Area with ARIA live region -->
    <div class="ai-chat-messages"
         id="{MESSAGES_ID}"
         role="log"
         aria-live="polite"
         aria-label="{MESSAGES_ARIA_LABEL}"
         aria-describedby="{CONTAINER_ID}-title"
         tabindex="0">
        <!-- Messages will be dynamically inserted here -->
    </div>

    <!-- Button to the latest message, shown while the messages are scrolled up -->
    <div class="ai-chat-scroll-anchor">
        <button class="ai-chat-scroll-bottom"
                type="button"
                title="{SCROLL_TO_BOTTOM}"
                aria-label="{SCROLL_TO_BOTTOM}"
                aria-hidden="true"
                tabindex="-1">
            <!-- Arrow of the send button, pointing down -->
            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" focusable="false">
                <path transform="rotate(180 10 10)" d="M8.99992 16V6.41407L5.70696 9.70704C5.31643 10.0976 4.68342 10.0976 4.29289 9.70704C3.90237 9.31652 3.90237 8.6835 4.29289 8.29298L9.29289 3.29298L9.36907 3.22462C9.76184 2.90427 10.3408 2.92686 10.707 3.29298L15.707 8.29298L15.7753 8.36915C16.0957 8.76192 16.0731 9.34092 15.707 9.70704C15.3408 10.0732 14.7618 10.0958 14.3691 9.7754L14.2929 9.70704L10.9999 6.41407V16C10.9999 16.5523 10.5522 17 9.99992 17C9.44764 17 8.99992 16.5523 8.99992 16Z"></path>
            </svg>
        </button>
    </div>

    <!-- Screen reader only status announcements -->
    <div class="ai-chat-sr-status"
         role="status"
         aria-live="assertive"
         aria-atomic="true"
         class="sr-only"></div>


    <!-- File Attachments Preview -->
    <!-- BEGIN chat_attachments_area -->
    <div class="ai-chat-attachments"
         style="display: none;"
         role="list"
         aria-label="{ATTACHMENTS_ARIA_LABEL}">
        <!-- Attachment thumbnails will be inserted here -->
    </div>
    <!-- END chat_attachments_area -->

    <!-- Input Area -->
    <div class="ai-chat-composer" data-expanded="false">
        <div class="ai-chat-composer-inner">
            <!-- Input Text Area -->
            <div class="ai-chat-composer-content">
                <div class="ai-chat-input-wrapper">
                    <textarea class="ai-chat-input"
                              id="{CONTAINER_ID}-input"
                              placeholder="{INPUT_PLACEHOLDER}"
                              maxlength="{CHAR_LIMIT}"
                              aria-label="{INPUT_ARIA_LABEL}"
                              aria-describedby="{CONTAINER_ID}-char-info"
                              rows="1"></textarea>
                </div>
            </div>

            <!-- Left Actions (Attach Button) -->
            <!-- BEGIN chat_attach_button -->
            <div class="ai-chat-composer-leading">
                <button class="ai-chat-composer-btn ai-chat-attach-btn"
                        type="button"
                        title="{ATTACH_FILE_TITLE}"
                        aria-label="{ATTACH_FILE_LABEL}">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" focusable="false">
                        <path d="M9.33496 16.5V10.665H3.5C3.13273 10.665 2.83496 10.3673 2.83496 10C2.83496 9.63273 3.13273 9.33496 3.5 9.33496H9.33496V3.5C9.33496 3.13273 9.63273 2.83496 10 2.83496C10.3673 2.83496 10.665 3.13273 10.665 3.5V9.33496H16.5L16.6338 9.34863C16.9369 9.41057 17.165 9.67857 17.165 10C17.165 10.3214 16.9369 10.5894 16.6338 10.6514L16.5 10.665H10.665V16.5C10.665 16.8673 10.3673 17.165 10 17.165C9.63273 17.165 9.33496 16.8673 9.33496 16.5Z"></path>
                    </svg>
                </button>
            </div>
            <!-- END chat_attach_button -->

            <!-- Right Actions (Send/Stop Buttons) -->
            <div class="ai-chat-composer-trailing">
                <div class="ai-chat-actions" role="group" aria-label="{ACTIONS_ARIA_LABEL}">
                    <!-- Send Button -->
                    <button class="ai-chat-composer-btn ai-chat-send"
                            type="button"
                            aria-label="{SEND_ARIA_LABEL}">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" focusable="false">
                            <path d="M8.99992 16V6.41407L5.70696 9.70704C5.31643 10.0976 4.68342 10.0976 4.29289 9.70704C3.90237 9.31652 3.90237 8.6835 4.29289 8.29298L9.29289 3.29298L9.36907 3.22462C9.76184 2.90427 10.3408 2.92686 10.707 3.29298L15.707 8.29298L15.7753 8.36915C16.0957 8.76192 16.0731 9.34092 15.707 9.70704C15.3408 10.0732 14.7618 10.0958 14.3691 9.7754L14.2929 9.70704L10.9999 6.41407V16C10.9999 16.5523 10.5522 17 9.99992 17C9.44764 17 8.99992 16.5523 8.99992 16Z"></path>
                        </svg>
                    </button>

                    <!-- Stop Button (hidden by default) -->
                    <button class="ai-chat-composer-btn ai-chat-stop"
                            type="button"
                            style="display: none;"
                            aria-label="{STOP_GENERATION}">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false">
                            <path d="M0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Character Counter -->
        <div class="ai-chat-char-counter" id="{CONTAINER_ID}-char-info">
            <span class="ai-chat-char-count" aria-live="polite">0</span> / <span class="ai-chat-char-limit">{CHAR_LIMIT}</span>
        </div>
    </div>

    <!-- Hidden File Input -->
    <!-- BEGIN chat_file_input -->
    <input type="file"
           class="ai-chat-file-input"
           multiple
           aria-label="{FILE_INPUT_ARIA_LABEL}"
           tabindex="-1">
    <!-- END chat_file_input -->

    <!-- Legal Disclaimer -->
    <!-- BEGIN disclaimer -->
    <div class="ai-chat-disclaimer" role="contentinfo">
        {DISCLAIMER}
    </div>
    <!-- END disclaimer -->

    <!-- Session Management (hidden) -->
    {SESSION_MANAGEMENT_HTML}
</div>
