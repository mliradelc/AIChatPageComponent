# Local ILIAS 9.24 test environment with the AIChatPageComponent plugin mounted.
#
# Start:  docker compose up -d
# Open:   http://localhost:8080
#
# ILIAS is installed automatically on the first start (ILIAS_AUTO_SETUP=1).
# The root password is printed in the container log:  docker compose logs ilias
# Then install and activate the plugin under Administration > Extending ILIAS > Plugins.
#
# The plugin folder of this repository is mounted at the path ILIAS expects
# for PageComponent plugins, so no copy or git clone is needed inside the container.
#
# Environment variables are taken from the srsolutions/ilias image README
# (tag 9-php8.2-apache / 9.24-php8.2-apache, ILIAS < 10 data path).

services:
  mysql:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ilias-root
      MARIADB_DATABASE: ilias
      MARIADB_USER: ilias
      MARIADB_PASSWORD: ilias
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30

  ilias:
    image: srsolutions/ilias:9.24-php8.2-apache
    depends_on:
      mysql:
        condition: service_healthy
    # Bound to loopback so the test instance is not reachable from other hosts
    ports:
      - "127.0.0.1:8080:80"
    environment:
      ILIAS_AUTO_SETUP: "1"
      ILIAS_DB_HOST: mysql
      ILIAS_DB_NAME: ilias
      ILIAS_DB_USER: ilias
      ILIAS_DB_PASSWORD: ilias
      # Must match the URL used in the browser, otherwise generated links point to the container hostname
      ILIAS_HTTP_PATH: http://localhost:8080
    volumes:
      # Web-accessible data directory (ILIAS < 10 path)
      - ilias-data:/var/www/html/data
      # Private data directory where uploaded resources are stored
      - ilias-iliasdata:/var/iliasdata/ilias
      # This repository, mounted as the plugin folder inside ILIAS
      - ./:/var/www/html/Customizing/global/plugins/Services/COPage/PageComponent/AIChatPageComponent

volumes:
  mysql-data:
  ilias-data:
  ilias-iliasdata:
